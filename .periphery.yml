# Retains for evals/audit.sh. A false "unused" becomes a wrong deletion, so every line errs toward keeping code.
# The index stores are built with DEBUG and POMELO_EVALS defined, so #if DEBUG || POMELO_EVALS code is indexed and
# its users (the --snapshot-* and --eval-* hooks) count. The libraries' public API needs no retain: the app and
# the CLI are indexed with them, so what they call is used and what nobody calls is reported.

# @objc selectors: ServicesProvider.convertFiles is reached by name from Info.plist's NSServices.
retain_objc_annotated: true

# Properties that Codable, Equatable and Hashable synthesize code for (settings.v1, the CLI's JSON, the evals'
# results, private Key structs compared with ==).
retain_codable_properties: true
retain_equatable_properties: true
retain_hashable_properties: true

# Parameters a protocol or an @objc signature fixes.
retain_unused_protocol_func_params: true

# Objects an assign-only property keeps alive: the Services provider is weak in NSApp, the pill controller owns its
# window.
retain_assign_only_property_types:
  - ServicesProvider
  - ProgressPillController

# App Intents are found through the generated Metadata.appintents (AppIntent, AppEntity, AppShortcutsProvider and
# their static members such as `description`); the Quick Action's principal class is named in its Info.plist.
retain_files:
  - App/Sources/Intents/**
  - App/QuickAction/**

report_exclude:
  - "**/checkouts/**"
  - "**/SourcePackages/**"
  - Tests/**
  - App/Tests/**
  - Sources/PomeloTestSupport/**
