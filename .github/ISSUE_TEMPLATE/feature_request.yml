name: Feature request
description: A conversion, tool or idea you'd like Pomelo to have.
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: What do you want to do?
      description: The job, in your words (e.g. "turn a folder of HEIC photos into one PDF").
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The app, website or command you use now, if any.
