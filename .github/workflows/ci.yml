name: CI

# Manual for now: Pomelo builds with Xcode 27, and GitHub's macOS runners offer up to Xcode 26.6, whose compiler hangs
# on the package. Bring back `push` and `pull_request` once a runner image has Xcode 27.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Pomelo needs Xcode 27 (see docs/development.md).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build
      - name: Test
        run: swift test
